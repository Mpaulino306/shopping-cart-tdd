name: CI ShoppingCart C#

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ShoppingCartSolution.slnx

    - name: Build project
      run: dotnet build ShoppingCartSolution.slnx --no-restore

    - name: Run tests
      run: dotnet test ShoppingCartSolution.slnx --no-build --verbosity normal
